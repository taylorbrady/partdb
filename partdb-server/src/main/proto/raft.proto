syntax = "proto3";

package partdb.peer.v1;

option java_multiple_files = false;
option java_outer_classname = "PeerProto";
option java_package = "io.partdb.server.peer.proto";

service RaftPeer {
  rpc Send(stream PeerMessage) returns (SendResponse);
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message SendResponse {}

message PeerMessage {
  oneof message {
    PreVote pre_vote = 1;
    PreVoteResponse pre_vote_response = 2;
    RequestVote request_vote = 3;
    RequestVoteResponse request_vote_response = 4;
    AppendEntries append_entries = 5;
    AppendAccepted append_accepted = 6;
    AppendRejected append_rejected = 7;
    Heartbeat heartbeat = 8;
    HeartbeatResponse heartbeat_response = 9;
    SnapshotInstalled snapshot_installed = 10;
    ReadIndexRequest read_index_request = 11;
    ReadIndexResponse read_index_response = 12;
    TimeoutNow timeout_now = 13;
  }
}

message PreVote {
  uint64 term = 1;
  uint64 last_log_index = 2;
  uint64 last_log_term = 3;
}

message PreVoteResponse {
  uint64 term = 1;
  bool granted = 2;
}

message RequestVote {
  uint64 term = 1;
  uint64 last_log_index = 2;
  uint64 last_log_term = 3;
  bool leadership_transfer = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool granted = 2;
}

message AppendEntries {
  uint64 term = 1;
  uint64 prev_log_index = 2;
  uint64 prev_log_term = 3;
  repeated LogEntry entries = 4;
  uint64 commit_index = 5;
}

message AppendAccepted {
  uint64 term = 1;
  uint64 match_index = 2;
}

message AppendRejected {
  uint64 term = 1;
  uint64 rejected_index = 2;
  uint64 hint_index = 3;
  uint64 hint_term = 4;
}

message Heartbeat {
  uint64 term = 1;
  uint64 commit_index = 2;
  uint64 round = 3;
}

message HeartbeatResponse {
  uint64 term = 1;
  uint64 round = 2;
}

message SnapshotInstalled {
  uint64 term = 1;
  uint64 match_index = 2;
}

message ReadIndexRequest {
  uint64 term = 1;
  int64 id = 2;
}

message ReadIndexResponse {
  uint64 term = 1;
  int64 id = 2;
  optional uint64 read_index = 3;
}

message TimeoutNow {
  uint64 term = 1;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  oneof entry {
    bytes command = 3;
    NoOp no_op = 4;
    Membership configuration = 5;
  }
}

message NoOp {}

message Membership {
  repeated string voters = 1;
  repeated string learners = 2;
}

message InstallSnapshotRequest {
  oneof payload {
    SnapshotHeader header = 1;
    bytes chunk = 2;
  }
}

message SnapshotHeader {
  uint64 term = 1;
  uint64 snapshot_index = 2;
  uint64 snapshot_term = 3;
  Membership membership = 4;
  uint64 size_bytes = 5;
  fixed32 crc32c = 6;
}

message InstallSnapshotResponse {}
