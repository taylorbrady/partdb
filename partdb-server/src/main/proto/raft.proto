syntax = "proto3";
package io.partdb.server.peer;

option java_package = "io.partdb.server.peer.proto";
option java_outer_classname = "RaftProto";

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc PreVote(PreVoteRequest) returns (PreVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc ReadIndex(ReadIndexRequest) returns (ReadIndexResponse);
}

message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message PreVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message PreVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
  int64 round = 7;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
  int64 round = 4;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  oneof entry {
    bytes data = 3;
    bool no_op = 4;
    Membership config = 5;
  }
}

message Membership {
  repeated string voters = 1;
  repeated string learners = 2;
}

message InstallSnapshotRequest {
  oneof payload {
    SnapshotHeader header = 1;
    bytes chunk = 2;
  }
}

message SnapshotHeader {
  int64 term = 1;
  string leader_id = 2;
  int64 snapshot_index = 3;
  int64 snapshot_term = 4;
  Membership membership = 5;
}

message InstallSnapshotResponse {
  int64 term = 1;
  int64 match_index = 2;
}

message ReadIndexRequest {
  int64 term = 1;
  uint64 context = 2;
}

message ReadIndexResponse {
  int64 term = 1;
  int64 read_index = 2;
  uint64 context = 3;
}
