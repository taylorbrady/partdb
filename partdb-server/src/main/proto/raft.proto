syntax = "proto3";
package io.partdb.server.peer;

option java_package = "io.partdb.server.peer.proto";
option java_outer_classname = "RaftProto";

service RaftService {
  rpc Send(stream RaftMessage) returns (SendResponse);
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message SendResponse {}

message RaftMessage {
  oneof message {
    PreVote pre_vote = 1;
    PreVoteResponse pre_vote_response = 2;
    RequestVote request_vote = 3;
    RequestVoteResponse request_vote_response = 4;
    AppendEntries append_entries = 5;
    AppendAccepted append_accepted = 6;
    AppendRejected append_rejected = 7;
    Heartbeat heartbeat = 8;
    HeartbeatResponse heartbeat_response = 9;
    InstallSnapshotResult install_snapshot_result = 10;
    ReadIndex read_index = 11;
    ReadIndexResponse read_index_response = 12;
    TimeoutNow timeout_now = 13;
  }
}

message PreVote {
  int64 term = 1;
  int64 last_log_index = 2;
  int64 last_log_term = 3;
}

message PreVoteResponse {
  int64 term = 1;
  bool granted = 2;
}

message RequestVote {
  int64 term = 1;
  int64 last_log_index = 2;
  int64 last_log_term = 3;
  bool leadership_transfer = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool granted = 2;
}

message AppendEntries {
  int64 term = 1;
  int64 prev_log_index = 2;
  int64 prev_log_term = 3;
  repeated LogEntry entries = 4;
  int64 commit_index = 5;
}

message AppendAccepted {
  int64 term = 1;
  int64 match_index = 2;
}

message AppendRejected {
  int64 term = 1;
  int64 rejected_index = 2;
  int64 hint_index = 3;
  int64 hint_term = 4;
}

message Heartbeat {
  int64 term = 1;
  int64 commit_index = 2;
  int64 round = 3;
}

message HeartbeatResponse {
  int64 term = 1;
  int64 round = 2;
}

message InstallSnapshotResult {
  int64 term = 1;
  int64 match_index = 2;
}

message ReadIndex {
  int64 term = 1;
  int64 id = 2;
}

message ReadIndexResponse {
  int64 term = 1;
  int64 id = 2;
  int64 read_index = 3;
}

message TimeoutNow {
  int64 term = 1;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  oneof entry {
    bytes command = 3;
    bool no_op = 4;
    Membership membership = 5;
  }
}

message Membership {
  repeated string voters = 1;
  repeated string learners = 2;
}

message InstallSnapshotRequest {
  oneof payload {
    SnapshotHeader header = 1;
    bytes chunk = 2;
  }
}

message SnapshotHeader {
  int64 term = 1;
  int64 snapshot_index = 2;
  int64 snapshot_term = 3;
  Membership membership = 4;
}

message InstallSnapshotResponse {}
