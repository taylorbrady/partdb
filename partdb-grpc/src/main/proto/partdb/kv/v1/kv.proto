syntax = "proto3";

package partdb.kv.v1;

option java_multiple_files = true;
option java_package = "io.partdb.grpc.kv.v1";

service KeyValueService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
}

enum ReadConsistency {
  READ_CONSISTENCY_UNSPECIFIED = 0;
  READ_CONSISTENCY_LINEARIZABLE = 1;
  READ_CONSISTENCY_LOCAL = 2;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
  int64 revision = 3;
}

message GetRequest {
  bytes key = 1;
  ReadConsistency consistency = 2;
}

message GetResponse {
  KeyValue entry = 1;
  int64 read_revision = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  int64 revision = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  int64 revision = 1;
}

message Mutation {
  message Put {
    bytes key = 1;
    bytes value = 2;
  }

  message Delete {
    bytes key = 1;
  }

  oneof kind {
    Put put = 1;
    Delete delete = 2;
  }
}

message WriteRequest {
  repeated Mutation mutations = 1;
}

message WriteResponse {
  int64 revision = 1;
}

message ScanRequest {
  bytes start_key = 1;
  optional bytes end_key = 2;
  int32 limit = 3;
  ReadConsistency consistency = 4;
}

message ScanResponse {
  repeated KeyValue entries = 1;
  int64 read_revision = 2;
}
