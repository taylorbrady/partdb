syntax = "proto3";

package partdb.kv.v1;

option java_multiple_files = true;
option java_outer_classname = "KvProto";
option java_package = "io.partdb.grpc.kv.v1";

service KeyValueService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Txn(TxnRequest) returns (TxnResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
}

enum ReadConsistency {
  READ_CONSISTENCY_UNSPECIFIED = 0;
  READ_CONSISTENCY_LINEARIZABLE = 1;
  READ_CONSISTENCY_LOCAL = 2;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
  int64 revision = 3;
}

message GetRequest {
  bytes key = 1;
  ReadConsistency consistency = 2;
}

message GetResponse {
  KeyValue entry = 1;
  int64 read_revision = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  int64 revision = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  int64 revision = 1;
}

message Mutation {
  message Put {
    bytes key = 1;
    bytes value = 2;
  }

  message Delete {
    bytes key = 1;
  }

  oneof kind {
    Put put = 1;
    Delete delete = 2;
  }
}

message Condition {
  message Exists {
    bytes key = 1;
  }

  message Missing {
    bytes key = 1;
  }

  message ValueEquals {
    bytes key = 1;
    bytes value = 2;
  }

  message RevisionEquals {
    bytes key = 1;
    int64 revision = 2;
  }

  oneof kind {
    Exists exists = 1;
    Missing missing = 2;
    ValueEquals value_equals = 3;
    RevisionEquals revision_equals = 4;
  }
}

message TxnRequest {
  repeated Condition conditions = 1;
  repeated Mutation mutations = 2;
}

message TxnResponse {
  message Committed {
    int64 revision = 1;
  }

  message ConditionFailed {}

  oneof result {
    Committed committed = 1;
    ConditionFailed condition_failed = 2;
  }
}

message ScanRequest {
  bytes start_key = 1;
  optional bytes end_key = 2;
  int32 limit = 3;
  ReadConsistency consistency = 4;
}

message ScanResponse {
  repeated KeyValue entries = 1;
  int64 read_revision = 2;
}
